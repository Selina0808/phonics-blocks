async function fetchImageFromWeb(word) {
  // 不缓存null/undefined，每次都重试
  if (imageCache[word] && imageCache[word] !== null) return imageCache[word];
  
  // 使用优化后的搜索词
  const query = SEARCH_QUERY_MAP[word] || word;
  
  try {
    const resp = await fetch('https://searchfree.site/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: query, include_images: true, max_results: 1 })
    });
    const data = await resp.json();
    const url = data.images?.[0]?.url;
    
    if (url) {
      imageCache[word] = url;
      saveImageCache();
      return url;
    }
  } catch(e) {}
  
  // 不缓存失败结果，下次重试
  return null;
}

// 批量预加载当前词库的图片
async function preloadImages(words) {
  const promises = words.map(w => fetchImageFromWeb(w.label));
  await Promise.allSettled(promises);
}

function getEmojiForWord(word) {
  const clean = word.toLowerCase().replace(/s$/, '');
  
  // 精确匹配
  if (EMOJI_MAP[word]) return EMOJI_MAP[word];
  if (EMOJI_MAP[clean]) return EMOJI_MAP[clean];
  
  // 模糊匹配
  for (const [key, val] of Object.entries(EMOJI_MAP)) {
    if (word.includes(key) || key.includes(word)) return val;
  }
  
  return '❓'; // 最终兜底
}

function init() {
  // 检查 localStorage 是否可用
  try {
    localStorage.setItem('__test', '1');
    localStorage.removeItem('__test');
  } catch(e) {
    document.getElementById('status').innerHTML = '⚠️ 浏览器阻止了本地存储，自定义图片无法保存。<br>请改用 <a href="http://localhost:8080" style="color:#0984e3;">本地服务器</a> 打开，或在 Edge 设置中关闭「跟踪预防」。';
  }
  loadImageCache();
  loadWordSets();
  renderWordSetButtons();
  
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      document.getElementById('recognizedText').textContent = `🎤 "${transcript}"`;
      recognition.transcript = transcript;
    };
    recognition.onend = () => {
      if (isRecording) try { recognition.start(); } catch(e) {}
    };
  }
  
  resetGame();
}

function loadWordSets() {
  const saved = localStorage.getItem('whatMissingWordSets');
  wordSets = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultWordSets));
}

function saveWordSets() {
  try {
    localStorage.setItem('whatMissingWordSets', JSON.stringify(wordSets));
  } catch (e) {
    console.warn('localStorage save failed:', e);
    alert('⚠️ 保存失败：图片数据太大，localStorage已满。\n建议减少自定义图片数量或刷新页面重试。');
  }
}

function setCardCount(count) {
  cardCount = count;
  // 更新按钮样式
  document.getElementById('cardCount6').style.background = count === 6 ? '#00b894' : '#f8f9fa';
  document.getElementById('cardCount6').style.borderColor = count === 6 ? '#00b894' : '#dfe6e9';
  document.getElementById('cardCount6').style.color = count === 6 ? 'white' : '#636e72';
  document.getElementById('cardCount9').style.background = count === 9 ? '#00b894' : '#f8f9fa';
  document.getElementById('cardCount9').style.borderColor = count === 9 ? '#00b894' : '#dfe6e9';
  document.getElementById('cardCount9').style.color = count === 9 ? 'white' : '#636e72';
  resetGame();
}

function getCurrentWords() {
  supplemented = false;
  let allWords = [];
  if (currentSetId === 'review') {
    for (const set of Object.values(wordSets)) allWords.push(...set.words);
  } else {
    allWords = wordSets[currentSetId]?.words || [];
  }
  // 随机打乱并抽取cardCount个
  const picked = [...allWords].sort(() => Math.random() - 0.5).slice(0, cardCount);

  // 当前词库单词不够时，从其他词库补充（按 label 去重），保证所选卡片数量生效
  if (picked.length < cardCount) {
    const usedLabels = new Set(picked.map(w => w.label));
    for (const set of Object.values(wordSets)) {
      if (picked.length >= cardCount) break;
      for (const w of set.words) {
        if (picked.length >= cardCount) break;
        if (!usedLabels.has(w.label)) {
          picked.push(w);
          usedLabels.add(w.label);
        }
      }
    }
    if (picked.length > allWords.length) supplemented = true;
  }

  return picked;
}

function resetGame() {
  gameState = 'idle';
  missingIndex = -1;
  currentGameItems = [];
  clearInterval(timer);
  document.getElementById('timer').textContent = '6';
  document.getElementById('timer').classList.remove('warning');
  document.getElementById('status').textContent = '点击「开始游戏」开始！';
  document.getElementById('status').className = 'status';
  document.getElementById('startBtn').style.display = '';
  document.getElementById('startBtn').textContent = '🎮 开始游戏 / Start Game';
  document.getElementById('micArea').style.display = 'none';
  document.getElementById('recognizedText').textContent = '';
  document.getElementById('playbackBtn').style.display = 'none';
  audioBlob = null;
  renderGrid(false);
}

function renderGrid(showMissing) {
  const grid = document.getElementById('grid');
  // 游戏进行中时使用固定的卡片序列，避免每次重新洗牌导致答案错位
  const items = (gameState !== 'idle' && currentGameItems.length > 0)
    ? currentGameItems
    : getCurrentWords();
  const showLabels = document.getElementById('showLabels').checked;
  grid.innerHTML = '';
  
  // 根据卡片数量调整样式
  grid.className = 'grid' + (cardCount === 9 ? ' grid-9' : '');
  
  // 显示加载状态
  const statusEl = document.getElementById('status');
  const originalText = statusEl.textContent;
  
  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${i}`;
    if (showMissing && i === missingIndex) {
      card.className = 'card missing';
    }
    if (!showMissing || i !== missingIndex) {
      // 先显示emoji占位
      card.innerHTML = showLabels
        ? `<div class="emoji">${item.emoji}</div><div class="label">${item.label}</div>`
        : `<div class="emoji">${item.emoji}</div>`;
      
      // 异步加载真实图片
      loadCardImage(i, item.label, item.emoji, item.image);
    }
    grid.appendChild(card);
  });
}

async function loadCardImage(index, word, emoji, customImage) {
  // 优先使用自定义图片，其次API搜索，最后emoji
  if (customImage) console.log(`[图片] 卡牌${index}(${word}): 使用自定义图片, 长度=${customImage.length}`);
  const imgUrl = customImage || await fetchImageFromWeb(word);
  if (!imgUrl) return; // 没有图片就用emoji
  
  const card = document.getElementById(`card-${index}`);
  if (!card) return;
  
  const showLabels = document.getElementById('showLabels').checked;
  const showMissing = gameState === 'guessing';
  
  // 检查这张牌是否已经被移除（guessing阶段）
  if (showMissing && index === missingIndex) return;
  
  // 自定义图片不需要 referrerpolicy 和 cache 清除逻辑
  const isCustom = !!customImage;
  const onErrorAttr = isCustom
    ? 'onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';"'
    : `onerror="this.style.display='none'; this.nextElementSibling.style.display='block'; imageCache['${word}']=undefined; saveImageCache();"`;
  const imgHtml = `<img class="card-image" src="${imgUrl}" referrerpolicy="no-referrer" ${onErrorAttr}>`;
  if (showLabels) {
    card.innerHTML = imgHtml
      + `<div class="emoji" style="display:none;">${emoji}</div>`
      + `<div class="label">${word}</div>`;
  } else {
    card.innerHTML = imgHtml
      + `<div class="emoji" style="display:none;">${emoji}</div>`;
  }
}

function startGame() {
  currentGameItems = getCurrentWords();
  const items = currentGameItems;
  if (items.length < 2) { alert('词库至少需要2个单词'); return; }
  
  gameState = 'memorize';
  missingIndex = Math.floor(Math.random() * items.length);
  timeLeft = items.length >= 9 ? 10 : 6; // 9张卡片10秒，6张卡片6秒
  document.getElementById('timer').textContent = timeLeft;
  document.getElementById('timer').classList.remove('warning');
  document.getElementById('status').textContent = supplemented
    ? '当前词库单词不够，已自动从其他词库补充卡片！记住这些图片！'
    : '记住这些图片！Remember them!';
  document.getElementById('status').className = 'status';
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('micArea').style.display = 'none';
  document.getElementById('recognizedText').textContent = '';
  document.getElementById('playbackBtn').style.display = 'none';
  audioBlob = null;
  renderGrid(false);

  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if (timeLeft <= 2) document.getElementById('timer').classList.add('warning');
    if (timeLeft <= 0) {
      clearInterval(timer);
      gameState = 'guessing';
      playBeep();
      document.getElementById('status').textContent = '🎤 说出哪个不见了！';
      document.getElementById('micArea').style.display = '';
      renderGrid(true);
    }
  }, 1000);
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

async function toggleMic() {
  if (!recognition) { document.getElementById('status').textContent = '❌ 请用Chrome/Edge浏览器'; return; }

  if (isRecording) {
    isRecording = false;
    try { recognition.stop(); } catch(e) {}
    if (audioRecorder && audioRecorder.state === 'recording') audioRecorder.stop();
    if (audioStream) audioStream.getTracks().forEach(t => t.stop());
    document.getElementById('micBtn').classList.remove('recording');
    document.getElementById('status').textContent = '⏳ 正在处理...';
    setTimeout(checkAnswer, 500);
  } else {
    try {
      audioBlob = null;
      audioChunks = [];
      audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/mp4' });
      audioRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
      audioRecorder.onstop = () => { if (audioChunks.length > 0) audioBlob = new Blob(audioChunks, { type: 'audio/mp4' }); };
      audioRecorder.start(100);
      isRecording = true;
      recognition.transcript = '';
      document.getElementById('recognizedText').textContent = '';
      document.getElementById('playbackBtn').style.display = 'none';
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('status').textContent = '🔴 正在录音...说完点击结束';
      try { recognition.start(); } catch(e) {}
    } catch (e) {
      document.getElementById('status').textContent = '❌ 请允许麦克风权限';
    }
  }
}

function checkAnswer() {
  playBeep();
  const spoken = (recognition.transcript || '').toLowerCase().trim();
  const items = currentGameItems;
  const correctAnswer = items[missingIndex].label.toLowerCase();
  const isCorrect = spoken.includes(correctAnswer);

  gameState = 'result';
  score.total++;

  if (isCorrect) {
    score.correct++;
    document.getElementById('status').textContent = `🎉 太棒了！是 ${items[missingIndex].label}！`;
    document.getElementById('status').className = 'status success';
  } else {
    document.getElementById('status').textContent = `😅 不对哦，是 ${items[missingIndex].label}！你说的是 "${spoken}"`;
    document.getElementById('status').className = 'status fail';
  }

  if (audioBlob && audioBlob.size > 0) {
    document.getElementById('playbackBtn').dataset.url = URL.createObjectURL(audioBlob);
    document.getElementById('playbackBtn').style.display = '';
  }

  document.getElementById('micArea').style.display = 'none';
  document.getElementById('startBtn').style.display = '';
  document.getElementById('startBtn').textContent = '🔄 再来一次 / Play Again';
  document.getElementById('score').textContent = `得分 Score: ${score.correct} / ${score.total}`;
  renderGrid(true);
}

function playbackRecording() {
  const url = document.getElementById('playbackBtn').dataset.url;
  if (!url) return;
  const audio = new Audio(url);
  audio.play().catch(() => {});
}

// ===== OCR图片识别 =====

let ocrResults = []; // 存储OCR结果 {image, word}

async function handleOcrUpload(event) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;
  
  const uploadArea = document.getElementById('ocrUploadArea');
  const progressDiv = document.getElementById('ocrProgress');
  const progressBar = document.getElementById('ocrProgressBar');
  const statusText = document.getElementById('ocrStatus');
  const previewDiv = document.getElementById('ocrPreview');
  
  uploadArea.classList.add('processing');
  uploadArea.innerHTML = '⏳ 正在识别中...';
  progressDiv.style.display = 'block';
  previewDiv.innerHTML = '';
  ocrResults = [];
  
  const total = files.length;
  let completed = 0;
  
  for (const file of files) {
    const imageData = await readFileAsDataURL(file);
    
    try {
      statusText.textContent = `正在识别第 ${completed + 1}/${total} 张...`;
      progressBar.style.width = `${(completed / total) * 100}%`;
      
      const result = await Tesseract.recognize(imageData, 'eng', {
        logger: m => {
          if (m.status === 'recognizing text') {
            const pct = Math.round(m.progress * 100);
            statusText.textContent = `识别中... ${pct}%`;
          }
        }
      });
      
      // 提取所有英文单词（去重、过滤短词）
      const text = result.data.text.trim();
      const allWords = text.match(/[a-zA-Z]{3,}/g) || [];
      const uniqueWords = [...new Set(allWords.map(w => w.toLowerCase()))];
      
      // 过滤掉常见干扰词
      const ignoreWords = ['the', 'and', 'for', 'are', 'but', 'not', 'you', 'all', 'can', 'had', 'her', 'was', 'one', 'our', 'out', 'day', 'get', 'has', 'him', 'his', 'how', 'its', 'may', 'new', 'now', 'old', 'see', 'way', 'who', 'boy', 'did', 'let', 'put', 'say', 'she', 'too', 'use', 'shop', 'at', 'the', 'page', 'clothes'];
      const filteredWords = uniqueWords.filter(w => !ignoreWords.includes(w) && w.length >= 3);
      
      // 为每个单词查找匹配的emoji
      filteredWords.forEach(word => {
        const emoji = getEmojiForWord(word);
        
        ocrResults.push({
          image: null, // 不用原图，用emoji
          emoji: emoji,
          word: word,
          rawText: text.substring(0, 50)
        });
      });
      
    } catch (e) {
      console.error('OCR error:', e);
      ocrResults.push({
        image: imageData,
        word: 'unknown',
        rawText: '识别失败'
      });
    }
    
    completed++;
    progressBar.style.width = `${(completed / total) * 100}%`;
  }
  
  // 显示结果
  statusText.textContent = `识别完成！共 ${ocrResults.length} 张`;
  uploadArea.classList.remove('processing');
  uploadArea.innerHTML = '📷 点击继续上传图片';
  
  renderOcrPreview();
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderOcrPreview() {
  const container = document.getElementById('ocrPreview');
  if (ocrResults.length === 0) {
    container.innerHTML = '';
    return;
  }
  
  let html = '<h4 style="color: #00b894; margin-bottom: 10px;">✅ 识别结果（可编辑）</h4>';
  
  ocrResults.forEach((item, i) => {
    html += `

        <div style="font-size: 48px; width: 60px; text-align: center;">${item.emoji}</div>
        <div class="word-info">

                 placeholder="输入英文单词">

        </div>
        <button onclick="deleteOcrWord(${i})" title="删除" style="background: #ff6b6b; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 16px; margin-left: 8px;">✕</button>
      </div>
    `;
  });

  html += `
    <div class="ocr-preview-item" style="border: 2px dashed #ddd; background: #f9f9f9;">
      <div style="font-size: 48px; width: 60px; text-align: center;">➕</div>

               onkeypress="if(event.key==='Enter')addOcrWord()">

    </div>
  `;
  
  html += `
    <div style="margin-top: 15px; display: flex; gap: 10px;">

  container.innerHTML = html;

function saveOcrAsWordSet() {
  const validResults = ocrResults.filter(r => r.word && r.word !== 'unknown');
  
  if (validResults.length < 2) {
    alert('至少需要2个有效单词');
    return;
  }

  }
  
  const words = validResults.map(r => ({
    emoji: r.emoji || '📝', // 使用自动匹配的emoji
    label: r.word,
    image: null // 不保存图片，使用emoji
  }));

function addWordSet() {
  let name = document.getElementById('setName').value.trim();
  const text = document.getElementById('newWords').value.trim();
  
  if (!name) {
    const existing = Object.keys(wordSets).filter(k => k.startsWith('lesson'));
    name = `📖 第${existing.length + 1}课`;
  }
  if (!text) { alert('请输入单词'); return; }
  
  const words = parseWords(text);
  if (words.length < 2) { alert('至少需要2个单词'); return; }
  
  const id = 'lesson_' + Date.now();
  wordSets[id] = { name, words };
  saveWordSets();
  renderWordSetButtons();
  document.getElementById('setName').value = '';
  document.getElementById('newWords').value = '';
  renderSavedWordSets();
  alert(`添加成功！"${name}" 包含 ${words.length} 个单词`);
}

function parseWords(text) {
  return text.split('\n').filter(l => l.trim()).map(line => {
    const parts = line.trim().split(/\s+/);
    return parts.length >= 2 ? { emoji: parts[0], label: parts.slice(1).join(' ').toLowerCase() } : null;
  }).filter(Boolean);
}

function deleteWordSet(id) {
  if (Object.keys(wordSets).length <= 1) { alert('至少保留一个词库'); return; }
  if (!confirm(`确定删除「${wordSets[id].name}」吗？`)) return;
  delete wordSets[id];
  saveWordSets();
  if (currentSetId === id) currentSetId = Object.keys(wordSets)[0];
  renderWordSetButtons();
  renderSavedWordSets();
  resetGame();
}

function resizeImage(file, maxSize, quality) {
  maxSize = maxSize || 200;
  quality = quality || 0.7;
  return new Promise(function(resolve) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = h * maxSize / w; w = maxSize; }
          else { w = w * maxSize / h; h = maxSize; }
        }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ========== 单词表功能 ==========
function getWordPhonetic(word) {
  const clean = word.toLowerCase().replace(/s$/, '');
  if (dictionary[word]) return dictionary[word];
  if (dictionary[clean]) return dictionary[clean];
  // 模糊匹配
  for (const [key, val] of Object.entries(dictionary)) {
    if (word.includes(key) || key.includes(word)) return val;
  }
  return { phonetic: '/', chinese: '—' };
}

function openWordList() {
  // 收集所有单词（去重）
  const allWords = new Set();
  for (const set of Object.values(wordSets)) {
    set.words.forEach(w => allWords.add(w.label.toLowerCase()));
  }
  
  const sortedWords = [...allWords].sort();
  
  let html = `
    <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0; color: #2d3436;">📖 总词库单词表（${sortedWords.length}词）</h3>
      <button onclick="printWordList()" style="padding: 6px 12px; background: #0984e3; color: white; border: none; border-radius: 6px; cursor: pointer;">🖨️ 打印</button>
    </div>
    <div style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; font-size: 0.95em;">
        <thead>
          <tr style="background: #00b894; color: white;">
            <th style="padding: 10px; text-align: left; border-radius: 8px 0 0 0;">#</th>
            <th style="padding: 10px; text-align: left;">单词</th>
            <th style="padding: 10px; text-align: left;">音标</th>
            <th style="padding: 10px; text-align: left; border-radius: 0 8px 0 0;">中文</th>
          </tr>
        </thead>
        <tbody>
  `;
  
  sortedWords.forEach((word, i) => {
    const info = getWordPhonetic(word);
    const bg = i % 2 === 0 ? '#f8f9fa' : '#fff';
    html += `
      <tr style="background: ${bg}; border-bottom: 1px solid #eee;">
        <td style="padding: 8px 10px; color: #b2bec3;">${i + 1}</td>
        <td style="padding: 8px 10px; font-weight: bold; font-size: 1.05em;">${word}</td>
        <td style="padding: 8px 10px; color: #6c5ce7; font-family: serif;">${info.phonetic}</td>
        <td style="padding: 8px 10px; color: #e17055;">${info.chinese}</td>
      </tr>
    `;
  });
  
  html += `
        </tbody>
      </table>
    </div>
  `;
  
  document.getElementById('wordListContent').innerHTML = html;
  document.getElementById('wordListModal').style.display = 'flex';
}

function closeWordList() {
  document.getElementById('wordListModal').style.display = 'none';
}

function printWordList() {
  const content = document.getElementById('wordListContent').innerHTML;
  const win = window.open('', '', 'width=800,height=600');
  win.document.write(`
    <html><head><title>单词表</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #ddd; }
      th { background: #00b894; color: white; }
      tr:nth-child(even) { background: #f8f9fa; }
    </style></head><body>
    <h2>📖 总词库单词表</h2>
    ${content}
    </body></html>
  `);
  win.document.close();
  win.print();
}
