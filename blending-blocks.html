<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼读积木 - Blending Blocks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 1.5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        /* 分类标签 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .tab {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .tab.active {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
        }

        /* 单词网格 */
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin: 30px 0;
            position: relative;
            z-index: 1;
        }

        .word-btn {
            padding: 15px 10px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #2d3748, #1a202c);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .word-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }

        .word-btn.selected {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            transform: scale(1.1);
        }

        /* 积木区域 */
        .blocks-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .blocks-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .phoneme-block {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .phoneme-block:nth-child(1) {
            background: linear-gradient(145deg, #667eea, #764ba2);
        }

        .phoneme-block:nth-child(2) {
            background: linear-gradient(145deg, #f093fb, #f5576c);
        }

        .phoneme-block:nth-child(3) {
            background: linear-gradient(145deg, #4facfe, #00f2fe);
        }

        .phoneme-block:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .phoneme-block:active {
            transform: scale(0.95);
        }

        .plus-sign {
            font-size: 2em;
            color: #a0a0a0;
        }

        .blend-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .blend-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.5);
        }

        .result-word {
            font-size: 3em;
            font-weight: bold;
            margin-top: 20px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-height: 60px;
        }

        /* 例句区域 */
        .sentence-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            text-align: left;
        }

        .sentence-area h3 {
            color: #f39c12;
            margin-bottom: 15px;
        }

        .sentence {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sentence:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .sentence .en {
            font-size: 1.1em;
            color: white;
        }

        .sentence .cn {
            font-size: 0.9em;
            color: #a0a0a0;
            margin-top: 5px;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn.primary {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }

        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* 音量控制 */
        .volume-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            z-index: 100;
        }

        .volume-slider {
            width: 100px;
            margin-left: 10px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .phoneme-block {
                width: 60px;
                height: 60px;
                font-size: 1.5em;
            }

            .word-grid {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            }

            .blocks-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

        <header class="header">
            <h1>🧱 拼读积木</h1>
            <p>点单词选词 → 点音素块听发音 → 连起来拼读 → 看例句</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-category="cvc">CVC 短元音</button>
            <button class="tab" data-category="consonant">辅音连缀</button>
            <button class="tab" data-category="long">长元音</button>
            <button class="tab" data-category="noun">名词</button>
            <button class="tab" data-category="verb">动词</button>
        </div>

        <div class="word-grid" id="wordGrid"></div>

        <div class="blocks-area">
            <div class="blocks-container" id="blocksContainer">
                <div class="phoneme-block" data-index="0">?</div>
                <span class="plus-sign">+</span>
                <div class="phoneme-block" data-index="1">?</div>
                <span class="plus-sign">+</span>
                <div class="phoneme-block" data-index="2">?</div>
            </div>

            <button class="blend-btn" id="blendBtn">🔗 连起来读</button>

            <div class="result-word" id="resultWord"></div>

            <div class="controls">
                <button class="control-btn primary" id="speakBtn">
                    🔊 单独发音
                </button>
                <button class="control-btn secondary" id="randomBtn">
                    🎲 随机下一个
                </button>
                <button class="control-btn secondary" id="slowBtn">
                    🐢 慢速播放
                </button>
            </div>

            <div class="sentence-area" id="sentenceArea">
                <h3>📖 引导输出</h3>
                <div id="sentences"></div>
            </div>
        </div>
    </div>

    <div class="volume-control">
        🔊 <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
    </div>

                    { word: 'tube', phonemes: ['t', 'u', 'be'], sentences: ['I squeeze the tube.', 'The tube is full.', '我挤管子。'] },
                    { word: 'use', phonemes: ['u', 'se'], sentences: ['I use a pencil.', 'Can I use this?', '我用铅笔。'] },
                    { word: 'huge', phonemes: ['h', 'u', 'ge'], sentences: ['The dinosaur is huge!', 'That is huge!', '恐龙很大！'] },
                    { word: 'fuse', phonemes: ['f', 'u', 'se'], sentences: ['Be careful with the fuse.', 'The fuse is hot.', '小心保险丝。'] }
                ],
                ee: [
                    { word: 'see', phonemes: ['s', 'ee'], sentences: ['I see a bird.', 'Can you see it?', '我看到一只鸟。'] },
                    { word: 'tree', phonemes: ['tr', 'ee'], sentences: ['I climb the tree.', 'The tree is tall.', '我爬树。'] },
                    { word: 'bee', phonemes: ['b', 'ee'], sentences: ['I see a bee.', 'The bee makes honey.', '我看到一只蜜蜂。'] },
                    { word: 'free', phonemes: ['fr', 'ee'], sentences: ['I am free today.', 'The bird is free.', '我今天有空。'] },
                    { word: 'knee', phonemes: ['k', 'n', 'ee'], sentences: ['I hurt my knee.', 'Bend your knee.', '我伤到膝盖了。'] }
                ],
                ea: [
                    { word: 'eat', phonemes: ['e', 'a', 't'], sentences: ['I eat breakfast.', 'What do you want to eat?', '我吃早餐。'] },
                    { word: 'tea', phonemes: ['t', 'ea'], sentences: ['I drink tea.', 'The tea is hot.', '我喝茶。'] },
                    { word: 'read', phonemes: ['r', 'ea', 'd'], sentences: ['I like to read.', 'Read this book.', '我喜欢阅读。'] },
                    { word: 'clean', phonemes: ['cl', 'ea', 'n'], sentences: ['I clean my room.', 'The room is clean.', '我打扫房间。'] },
                    { word: 'dream', phonemes: ['dr', 'ea', 'm'], sentences: ['I dream at night.', 'I have a good dream.', '我晚上做梦。'] }
                ]
            },
            noun: [
                { word: 'apple', phonemes: ['a', 'p', 'ple'], sentences: ['I eat an apple.', 'The apple is red.', '我吃一个苹果。'] },
                { word: 'ball', phonemes: ['b', 'a', 'll'], sentences: ['I kick the ball.', 'The ball is round.', '我踢球。'] },
                { word: 'cat', phonemes: ['c', 'a', 't'], sentences: ['The cat is sleeping.', 'I have a cat.', '猫在睡觉。'] },
                { word: 'dog', phonemes: ['d', 'o', 'g'], sentences: ['The dog is barking.', 'I like dogs.', '狗在叫。'] },
                { word: 'egg', phonemes: ['e', 'gg'], sentences: ['I eat an egg.', 'The egg is white.', '我吃一个鸡蛋。'] },
                { word: 'fish', phonemes: ['f', 'i', 'sh'], sentences: ['I see a fish.', 'The fish can swim.', '我看到一条鱼。'] },
                { word: 'girl', phonemes: ['g', 'i', 'rl'], sentences: ['The girl is happy.', 'I am a girl.', '女孩很开心。'] },
                { word: 'house', phonemes: ['h', 'ou', 'se'], sentences: ['I live in a house.', 'The house is big.', '我住在房子里。'] },
                { word: 'ice', phonemes: ['i', 'ce'], sentences: ['I like ice cream.', 'The ice is cold.', '我喜欢冰淇淋。'] },
                { word: 'juice', phonemes: ['j', 'u', 'ice'], sentences: ['I drink juice.', 'The juice is yummy.', '我喝果汁。'] }
            ],
            verb: [
                { word: 'run', phonemes: ['r', 'u', 'n'], sentences: ['I run fast.', 'Let us run!', '我跑得快。'] },
                { word: 'jump', phonemes: ['j', 'u', 'mp'], sentences: ['I jump high.', 'Can you jump?', '我跳得高。'] },
                { word: 'sing', phonemes: ['s', 'i', 'ng'], sentences: ['I like to sing.', 'Let us sing a song.', '我喜欢唱歌。'] },
                { word: 'dance', phonemes: ['d', 'a', 'nce'], sentences: ['I can dance.', 'She dances well.', '我会跳舞。'] },
                { word: 'read', phonemes: ['r', 'ea', 'd'], sentences: ['I read books.', 'Reading is fun.', '我读书。'] },
                { word: 'write', phonemes: ['w', 'r', 'i', 'te'], sentences: ['I write a letter.', 'I like to write.', '我写信。'] },
                { word: 'draw', phonemes: ['dr', 'a', 'w'], sentences: ['I draw pictures.', 'She draws well.', '我画画。'] },
                { word: 'play', phonemes: ['pl', 'a', 'y'], sentences: ['I play with friends.', 'Let us play!', '我和朋友玩。'] },
                { word: 'eat', phonemes: ['e', 'a', 't'], sentences: ['I eat lunch.', 'What do you eat?', '我吃午饭。'] },
                { word: 'drink', phonemes: ['dr', 'i', 'nk'], sentences: ['I drink water.', 'Do you want a drink?', '我喝水。'] }
            ]
        };

        // 全局变量
        let currentCategory = 'cvc';
        let currentVowel = 'a';
        let currentWord = null;
        let volume = 0.8;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            loadWords();
            setupEventListeners();
        });

        // 创建星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 1.5 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 加载单词
        function loadWords() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            let words = [];
            if (currentCategory === 'cvc') {
                words = wordDatabase.cvc[currentVowel] || [];
            } else if (currentCategory === 'consonant') {
                Object.values(wordDatabase.consonant).forEach(categoryWords => {
                    words = words.concat(categoryWords);
                });
            } else if (currentCategory === 'long') {
                Object.values(wordDatabase.long).forEach(categoryWords => {
                    words = words.concat(categoryWords);
                });
            } else if (currentCategory === 'noun') {
                words = wordDatabase.noun;
            } else if (currentCategory === 'verb') {
                words = wordDatabase.verb;
            }

            words.forEach(wordData => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.textContent = wordData.word;
                btn.addEventListener('click', () => selectWord(wordData, btn));
                grid.appendChild(btn);
            });

            // 清空积木区
            clearBlocks();
        }

        // 选择单词
        function selectWord(wordData, btn) {
            // 移除其他选中状态
            document.querySelectorAll('.word-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            currentWord = wordData;
            updateBlocks(wordData.phonemes);
            showSentences(wordData.sentences);
        }

        // 更新积木
        function updateBlocks(phonemes) {
            const blocks = document.querySelectorAll('.phoneme-block');
            blocks.forEach((block, index) => {
                if (phonemes[index]) {
                    block.textContent = phonemes[index];
                    block.style.opacity = '1';
                } else {
                    block.textContent = '?';
                    block.style.opacity = '0.5';
                }
            });

            document.getElementById('resultWord').textContent = '';
        }

        // 清空积木
        function clearBlocks() {
            const blocks = document.querySelectorAll('.phoneme-block');
            blocks.forEach(block => {
                block.textContent = '?';
                block.style.opacity = '0.5';
            });
            document.getElementById('resultWord').textContent = '';
            document.getElementById('sentences').innerHTML = '';
        }

        // 显示例句
        function showSentences(sentences) {
            const container = document.getElementById('sentences');
            container.innerHTML = '';

            sentences.forEach(sentence => {
                const div = document.createElement('div');
                div.className = 'sentence';
                div.innerHTML = `
                    <div class="en">${sentence}</div>
                    <div class="cn">${sentence}</div>
                `;
                div.addEventListener('click', () => speak(sentence));
                container.appendChild(div);
            });
        }

        // 语音合成
        function speak(text, rate = 1) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.volume = volume;
                utterance.rate = rate;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 逐个发音
        function speakPhonemes(phonemes, index = 0) {
            if (index < phonemes.length) {
                speak(phonemes[index], 0.7);
                setTimeout(() => {
                    speakPhonemes(phonemes, index + 1);
                }, 500);
            }
        }

        // 连起来读
        function blendWord() {
            if (currentWord) {
                speak(currentWord.word);
                document.getElementById('resultWord').textContent = currentWord.word;
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 分类标签
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    loadWords();
                });
            });

            // 积木点击
            document.querySelectorAll('.phoneme-block').forEach(block => {
                block.addEventListener('click', () => {
                    const phoneme = block.textContent;
                    if (phoneme && phoneme !== '?') {
                        speak(phoneme, 0.7);
                    }
                });
            });

            // 连起来读按钮
            document.getElementById('blendBtn').addEventListener('click', blendWord);

            // 单独发音按钮
            document.getElementById('speakBtn').addEventListener('click', () => {
                if (currentWord) {
                    speakPhonemes(currentWord.phonemes);
                }
            });

            // 随机下一个
            document.getElementById('randomBtn').addEventListener('click', () => {
                const buttons = document.querySelectorAll('.word-btn');
                if (buttons.length > 0) {
                    const randomIndex = Math.floor(Math.random() * buttons.length);
                    buttons[randomIndex].click();
                }
            });

            // 慢速播放
            document.getElementById('slowBtn').addEventListener('click', () => {
                if (currentWord) {
                    speak(currentWord.word, 0.5);
                }
            });

            // 音量控制
            document.getElementById('volumeSlider').addEventListener('input', (e) => {
                volume = e.target.value / 100;
            });
        }
    </script>
</body>
