<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼读积木 - Blending Blocks (Advanced)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 星空背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 1.5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 30px 0;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #a0a0a0;
            font-size: 1.1em;
        }

        /* 自由拼读区域 */
        .free-blend-area {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            margin: 30px 0;
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .free-blend-area h2 {
            color: #4facfe;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .free-blend-area p {
            color: #a0a0a0;
            margin-bottom: 20px;
        }

        .word-input-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .word-input {
            padding: 15px 25px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-size: 1.2em;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        .word-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.3);
        }

        .word-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .analyze-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            color: white;
            transition: all 0.3s ease;
        }

        .analyze-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
        }

        .free-blocks-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 30px 0;
            min-height: 100px;
        }

        .free-phoneme-block {
            min-width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(145deg, #2d3748, #1a202c);
        }

        .free-phoneme-block:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .free-phoneme-block:active {
            transform: scale(0.95);
        }

        .free-phoneme-block.empty {
            opacity: 0.3;
        }

        .free-plus-sign {
            font-size: 1.5em;
            color: #a0a0a0;
        }

        .free-blend-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .free-blend-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.5);
        }

        .free-result-word {
            font-size: 2.5em;
            font-weight: bold;
            margin-top: 15px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-height: 40px;
        }

        .phoneme-info {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            text-align: left;
        }

        .phoneme-info h4 {
            color: #4facfe;
            margin-bottom: 10px;
        }

        .phoneme-info-item {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .phoneme-info-item:last-child {
            border-bottom: none;
        }

        /* 分类标签 */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .tab {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .tab.active {
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
        }

        /* 单词网格 */
        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin: 30px 0;
            position: relative;
            z-index: 1;
        }

        .word-btn {
            padding: 15px 10px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            background: linear-gradient(145deg, #2d3748, #1a202c);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .word-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
        }

        .word-btn.selected {
            background: linear-gradient(145deg, #f39c12, #e67e22);
            transform: scale(1.1);
        }

        /* 积木区域 */
        .blocks-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            margin: 30px 0;
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
        }

        .blocks-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .phoneme-block {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .phoneme-block:nth-child(1) {
            background: linear-gradient(145deg, #667eea, #764ba2);
        }

        .phoneme-block:nth-child(2) {
            background: linear-gradient(145deg, #f093fb, #f5576c);
        }

        .phoneme-block:nth-child(3) {
            background: linear-gradient(145deg, #4facfe, #00f2fe);
        }

        .phoneme-block:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .phoneme-block:active {
            transform: scale(0.95);
        }

        .plus-sign {
            font-size: 2em;
            color: #a0a0a0;
        }

        .blend-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .blend-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(17, 153, 142, 0.5);
        }

        .result-word {
            font-size: 3em;
            font-weight: bold;
            margin-top: 20px;
            background: linear-gradient(45deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-height: 60px;
        }

        /* 例句区域 */
        .sentence-area {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            text-align: left;
        }

        .sentence-area h3 {
            color: #f39c12;
            margin-bottom: 15px;
        }

        .sentence {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sentence:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .sentence .en {
            font-size: 1.1em;
            color: white;
        }

        .sentence .cn {
            font-size: 0.9em;
            color: #a0a0a0;
            margin-top: 5px;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn.primary {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }

        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* 音量控制 */
        .volume-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 15px;
            z-index: 100;
        }

        .volume-slider {
            width: 100px;
            margin-left: 10px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .phoneme-block {
                width: 60px;
                height: 60px;
                font-size: 1.5em;
            }

            .word-grid {
                grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            }

            .blocks-area {
                padding: 20px;
            }

            .free-blend-area {
                padding: 20px;
            }

            .word-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <header class="header">
            <h1>🧱 拼读积木 - 进阶版</h1>
            <p>点单词选词 → 点音素块听发音 → 连起来拼读 → 自由拼读任意单词</p>
        </header>

        <!-- 自由拼读区域 -->
        <div class="free-blend-area">
            <h2>🔤 自由拼读</h2>
            <p>输入任意英语单词，按自然拼读规则拆解并发音</p>
            
            <div class="word-input-container">
                <input type="text" class="word-input" id="wordInput" placeholder="输入英语单词，如: cat, school, beautiful...">
                <button class="analyze-btn" id="analyzeBtn">🔍 分析发音</button>
            </div>

            <div class="free-blocks-container" id="freeBlocksContainer">
                <!-- Phoneme blocks will be dynamically inserted here -->
            </div>

            <div>
                <button class="free-blend-btn" id="freeBlendBtn">🔗 连起来读</button>
                <button class="free-blend-btn" id="freeSlowBtn" style="background: linear-gradient(45deg, #f39c12, #e67e22);">🐢 慢速播放</button>
                <button class="free-blend-btn" id="freeClearBtn" style="background: rgba(255, 255, 255, 0.2);">🗑️ 清除</button>
            </div>

            <div class="free-result-word" id="freeResultWord"></div>

            <div class="phoneme-info" id="phonemeInfo" style="display: none;">
                <h4>📝 发音规则解析</h4>
                <div id="phonemeInfoContent"></div>
            </div>
        </div>

        <!-- 原有功能 -->
        <div class="tabs">
            <button class="tab active" data-category="cvc">CVC 短元音</button>
            <button class="tab" data-category="consonant">辅音连缀</button>
            <button class="tab" data-category="long">长元音</button>
            <button class="tab" data-category="noun">名词</button>
            <button class="tab" data-category="verb">动词</button>
        </div>

        <div class="word-grid" id="wordGrid"></div>

        <div class="blocks-area">
            <div class="blocks-container" id="blocksContainer">
                <div class="phoneme-block" data-index="0">?</div>
                <span class="plus-sign">+</span>
                <div class="phoneme-block" data-index="1">?</div>
                <span class="plus-sign">+</span>
                <div class="phoneme-block" data-index="2">?</div>
            </div>

            <button class="blend-btn" id="blendBtn">🔗 连起来读</button>

            <div class="result-word" id="resultWord"></div>

            <div class="controls">
                <button class="control-btn primary" id="speakBtn">
                    🔊 单独发音
                </button>
                <button class="control-btn secondary" id="randomBtn">
                    🎲 随机下一个
                </button>
                <button class="control-btn secondary" id="slowBtn">
                    🐢 慢速播放
                </button>
            </div>

            <div class="sentence-area" id="sentenceArea">
                <h3>📖 引导输出</h3>
                <div id="sentences"></div>
            </div>
        </div>
    </div>

    <div class="volume-control">
        🔊 <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
    </div>

    <script>
        // ==================== 牛津自然拼读规则数据库 v7 ====================
        const PHONICS_RULES = {
            // 辅音二合字母（两个或三个字母，一个音）
            consonantDigraphs: [
                // 三个字母优先
                { pattern: /^tch/, sound: 'tch', description: 'tch音 /tʃ/' },
                // 两个字母
                { pattern: /^sh/, sound: 'sh', description: 'sh音 /ʃ/' },
                { pattern: /^ch/, sound: 'ch', description: 'ch音 /tʃ/' },
                { pattern: /^th/, sound: 'th', description: 'th音 /θ/' },
                { pattern: /^ph/, sound: 'ph', description: 'ph音 /f/' },
                { pattern: /^wh/, sound: 'wh', description: 'wh音 /w/' },
                { pattern: /^ck/, sound: 'ck', description: 'ck音 /k/' },
                { pattern: /^ng/, sound: 'ng', description: 'ng音 /ŋ/' },
                { pattern: /^qu/, sound: 'qu', description: 'qu音 /kw/' }
            ],
            
            // 辅音连缀（两个或三个辅音，各自发音）
            consonantBlends: [
                // 三个字母的连缀（优先匹配）
                { pattern: /^str/, sounds: ['s', 't', 'r'], position: 'initial' },
                { pattern: /^spr/, sounds: ['s', 'p', 'r'], position: 'initial' },
                { pattern: /^scr/, sounds: ['s', 'c', 'r'], position: 'initial' },
                { pattern: /^shr/, sounds: ['s', 'h', 'r'], position: 'initial' },
                { pattern: /^thr/, sounds: ['t', 'h', 'r'], position: 'initial' },
                { pattern: /^nch/, sounds: ['n', 'ch'], position: 'initial' },
                // 两个字母的连缀
                { pattern: /^bl/, sounds: ['b', 'l'], position: 'initial' },
                { pattern: /^cl/, sounds: ['c', 'l'], position: 'initial' },
                { pattern: /^fl/, sounds: ['f', 'l'], position: 'initial' },
                { pattern: /^gl/, sounds: ['g', 'l'], position: 'initial' },
                { pattern: /^pl/, sounds: ['p', 'l'], position: 'initial' },
                { pattern: /^sl/, sounds: ['s', 'l'], position: 'initial' },
                { pattern: /^br/, sounds: ['b', 'r'], position: 'initial' },
                { pattern: /^cr/, sounds: ['c', 'r'], position: 'initial' },
                { pattern: /^dr/, sounds: ['d', 'r'], position: 'initial' },
                { pattern: /^fr/, sounds: ['f', 'r'], position: 'initial' },
                { pattern: /^gr/, sounds: ['g', 'r'], position: 'initial' },
                { pattern: /^pr/, sounds: ['p', 'r'], position: 'initial' },
                { pattern: /^tr/, sounds: ['t', 'r'], position: 'initial' },
                { pattern: /^st/, sounds: ['s', 't'], position: 'initial' },
                { pattern: /^sp/, sounds: ['s', 'p'], position: 'initial' },
                { pattern: /^sk/, sounds: ['s', 'k'], position: 'initial' },
                { pattern: /^sm/, sounds: ['s', 'm'], position: 'initial' },
                { pattern: /^sn/, sounds: ['s', 'n'], position: 'initial' },
                { pattern: /^sw/, sounds: ['s', 'w'], position: 'initial' },
                { pattern: /^tw/, sounds: ['t', 'w'], position: 'initial' },
                { pattern: /^dw/, sounds: ['d', 'w'], position: 'initial' },
                // 词尾连缀
                { pattern: /nd$/, sounds: ['n', 'd'], position: 'final' },
                { pattern: /nt$/, sounds: ['n', 't'], position: 'final' },
                { pattern: /lt$/, sounds: ['l', 't'], position: 'final' },
                { pattern: /mp$/, sounds: ['m', 'p'], position: 'final' },
                { pattern: /ft$/, sounds: ['f', 't'], position: 'final' },
                { pattern: /ld$/, sounds: ['l', 'd'], position: 'final' },
                { pattern: /lk$/, sounds: ['l', 'k'], position: 'final' },
                { pattern: /nk$/, sounds: ['n', 'k'], position: 'final' },
                { pattern: /sk$/, sounds: ['s', 'k'], position: 'final' },
                { pattern: /pt$/, sounds: ['p', 't'], position: 'final' }
            ],
            
            // R控制元音
            rControlledVowels: [
                { pattern: /^ear/, sound: 'ear', description: 'ear音 /ɪə/' },
                { pattern: /^eə/, sound: 'eə', description: 'eə音 /eə/' },
                { pattern: /^eer/, sound: 'eer', description: 'eer音 /ɪə/' },
                { pattern: /^oor/, sound: 'oor', description: 'oor音 /ɔː/' },
                { pattern: /^air/, sound: 'air', description: 'air音 /eə/' },
                { pattern: /^are/, sound: 'are', description: 'are音 /eə/' },
                { pattern: /^ar/, sound: 'ar', description: 'ar音 /ɑː/' },
                { pattern: /^er/, sound: 'er', description: 'er音 /ɜː/' },
                { pattern: /^ir/, sound: 'ir', description: 'ir音 /ɜː/' },
                { pattern: /^or/, sound: 'or', description: 'or音 /ɔː/' },
                { pattern: /^ur/, sound: 'ur', description: 'ur音 /ɜː/' }
            ],
            
            // 元音组合（两个或三个字母，一个音）
            vowelTeams: [
                // 四个字母的组合（最高优先）
                { pattern: /^eigh/, sound: 'eigh', description: 'eigh音 /eɪ/' },
                // 三个字母的组合（优先）
                { pattern: /^igh/, sound: 'igh', description: 'igh音 /aɪ/' },
                // 两个字母的组合
                { pattern: /^ai/, sound: 'ai', description: 'ai音 /eɪ/' },
                { pattern: /^ay/, sound: 'ay', description: 'ay音 /eɪ/' },
                { pattern: /^ee/, sound: 'ee', description: 'ee音 /iː/' },
                { pattern: /^ea/, sound: 'ea', description: 'ea音 /iː/' },
                { pattern: /^ey/, sound: 'ey', description: 'ey音 /iː/' },
                { pattern: /^ie/, sound: 'ie', description: 'ie音 /aɪ/' },
                { pattern: /^oa/, sound: 'oa', description: 'oa音 /əʊ/' },
                { pattern: /^ow/, sound: 'ow', description: 'ow音 /əʊ/' },
                { pattern: /^ue/, sound: 'ue', description: 'ue音 /uː/' },
                { pattern: /^ui/, sound: 'ui', description: 'ui音 /uː/' },
                { pattern: /^oo/, sound: 'oo', description: 'oo音 /uː/' },
                { pattern: /^ew/, sound: 'ew', description: 'ew音 /juː/' },
                { pattern: /^ou/, sound: 'ou', description: 'ou音 /aʊ/' },
                { pattern: /^oi/, sound: 'oi', description: 'oi音 /ɔɪ/' },
                { pattern: /^oy/, sound: 'oy', description: 'oy音 /ɔɪ/' },
                { pattern: /^au/, sound: 'au', description: 'au音 /ɔː/' },
                { pattern: /^aw/, sound: 'aw', description: 'aw音 /ɔː/' },
                { pattern: /^all/, sound: 'all', description: 'all音 /ɔːl/' }
            ],
            
            // 不发音字母
            silentLetters: [
                { pattern: /^kn/, description: 'k不发音, 只发n' },
                { pattern: /^wr/, description: 'w不发音, 只发r' },
                { pattern: /^gn/, description: 'g不发音, 只发n' },
                { pattern: /mb$/, description: 'b不发音, 只发m' },
                { pattern: /lm$/, description: 'l不发音' }
            ],
            
            // 短元音（闭音节）
            shortVowels: {
                'a': { sound: 'a', description: '短元音 /æ/' },

        // ==================== 音素分词器 v7 ====================
        class PhonemeSegmenter {
            constructor() {
                this.rules = PHONICS_RULES;
            }

            segment(word) {
                word = word.toLowerCase().trim();
                const result = [];
                let pos = 0;
                
                while (pos < word.length) {
                    const remaining = word.substring(pos);
                    
                    // 特殊处理：sch组合（school, scholar等）- h不发音
                    if (remaining.startsWith('sch')) {
                        // 添加s
                        result.push({ type: 'consonant', letters: 's', sound: 's', description: '辅音 /s/', length: 1 });
                        pos++;
                        // 添加c（硬音，因为后面是o）
                        result.push({ type: 'consonant', letters: 'c', sound: 'k', description: 'c在sch中发 /k/', length: 1 });
                        pos++;
                        // 跳过h（不发音）
                        result.push({ type: 'silent', letters: 'h', sound: '', description: 'sch中h不发音', length: 1 });
                        pos++;
                        continue;
                    }
                    
                    // 1. 检查不发音字母
                    const silentMatch = this.matchSilent(remaining, pos, word);
                    if (silentMatch) {
                        result.push(silentMatch);
                        pos += silentMatch.length;
                        continue;
                    }
                    
                    // 2. 检查辅音二合字母
                    const digraphMatch = this.matchDigraph(remaining, pos, word);
                    if (digraphMatch) {
                        result.push(digraphMatch);
                        pos += digraphMatch.length;
                        continue;
                    }
                    
                    // 3. 检查辅音连缀
                    const blendMatch = this.matchBlend(remaining, pos, word.length);
                    if (blendMatch) {
                        result.push(blendMatch);
                        pos += blendMatch.length;
                        continue;
                    }
                    
                    // 4. 检查R控制元音
                    const rMatch = this.matchRControlled(remaining);
                    if (rMatch) {
                        result.push(rMatch);
                        pos += rMatch.length;
                        continue;
                    }
                    
                    // 5. 检查元音组合
                    const teamMatch = this.matchVowelTeam(remaining);
                    if (teamMatch) {
                        result.push(teamMatch);
                        pos += teamMatch.length;
                        continue;
                    }
                    
                    // 6. 检查Magic E模式（元音+辅音+静音e）
                    const magicResult = this.matchMagicEFull(remaining, pos, word.length, word);
                    if (magicResult) {
                        result.push(...magicResult);
                        pos += magicResult.reduce((sum, p) => sum + p.length, 0);
                        continue;
                    }
                    
                    // 7. 单个字母
                    const singleMatch = this.matchSingle(remaining, pos, word.length, word);
                    if (singleMatch) {
                        result.push(singleMatch);
                        pos += singleMatch.length;
                        continue;
                    }
                    
                    pos++;
                }
                
                return result;
            }
            
            matchSilent(str, pos, word) {
                for (const rule of this.rules.silentLetters) {
                    const match = str.match(rule.pattern);
                    if (match && match.index === 0) {
                        if (rule.pattern.source === '^kn' && pos !== 0) continue;
                        if (rule.pattern.source === '^wr' && pos !== 0) continue;
                        if (rule.pattern.source === '^gn' && pos !== 0) continue;
                        if (rule.pattern.source === 'mb$' && pos + match[0].length !== word.length) continue;
                        if (rule.pattern.source === 'lm$' && pos + match[0].length !== word.length) continue;
                        
                        return {
                            type: 'silent',
                            letters: match[0],
                            sound: '',
                            description: rule.description,
                            length: match[0].length
                        };
                    }
                }
                return null;
            }
            
            matchDigraph(str, pos, word) {
                for (const rule of this.rules.consonantDigraphs) {
                    const match = str.match(rule.pattern);
                    if (match && match.index === 0) {
                        // sch中的ch不是二合字母，而是s + c(硬音) + h
                        if (rule.pattern.source === '^ch' && pos > 0 && word[pos - 1] === 's') {
                            continue;
                        }
                        return {
                            type: 'digraph',
                            letters: match[0],
                            sound: rule.sound,
                            description: rule.description,
                            length: match[0].length
                        };
                    }
                }
                return null;
            }
            
            matchBlend(str, pos, wordLen) {
                for (const rule of this.rules.consonantBlends) {
                    const match = str.match(rule.pattern);
                    if (match && match.index === 0) {
                        if (rule.position === 'initial' && pos !== 0) continue;
                        if (rule.position === 'final' && pos + match[0].length !== wordLen) continue;
                        
                        return {
                            type: 'blend',
                            letters: match[0],
                            sound: rule.sounds.join(' + '),
                            description: '辅音连缀',
                            length: match[0].length,
                            sounds: rule.sounds
                        };
                    }
                }
                return null;
            }
            
            matchRControlled(str) {
                for (const rule of this.rules.rControlledVowels) {
                    const match = str.match(rule.pattern);
                    if (match && match.index === 0) {
                        return {
                            type: 'r-controlled',
                            letters: match[0],
                            sound: rule.sound,
                            description: rule.description,
                            length: match[0].length
                        };
                    }
                }
                return null;
            }
            
            matchVowelTeam(str) {
                for (const rule of this.rules.vowelTeams) {
                    const match = str.match(rule.pattern);
                    if (match && match.index === 0) {
                        return {
                            type: 'vowel-team',
                            letters: match[0],
                            sound: rule.sound,
                            description: rule.description,
                            length: match[0].length
                        };
                    }
                }
                return null;
            }
            
            /**
             * Magic E完整匹配：返回元音（长音）+ 辅音 + 静音e
             */
            matchMagicEFull(str, pos, wordLen, word) {
                if (str.length < 3) return null;
                const vowel = str[0];
                const consonant = str[1];
                const e = str[2];
                
                if (!this.isVowel(vowel)) return null;
                if (!this.isConsonant(consonant)) return null;
                if (e !== 'e') return null;
                // e必须是单词最后一个字符
                if (pos + 3 !== wordLen) return null;
                
                let sound, description;
                switch (vowel) {
                    case 'a': sound = 'ā'; description = 'Magic E: a发长音 /eɪ/'; break;
                    case 'i': sound = 'ī'; description = 'Magic E: i发长音 /aɪ/'; break;
                    case 'o': sound = 'ō'; description = 'Magic E: o发长音 /əʊ/'; break;
                    case 'u': sound = 'ū'; description = 'Magic E: u发长音 /juː/'; break;
                    default: return null;
                }
                
                return [
                    { type: 'magic-e', letters: vowel, sound: sound, description: description, length: 1 },
                    { type: 'consonant', letters: consonant, sound: consonant, description: '辅音 /' + consonant + '/', length: 1 },
                    { type: 'silent-e', letters: 'e', sound: '', description: 'Magic E中的静音e', length: 1 }
                ];
            }
            
            matchSingle(str, pos, wordLen, word) {
                const char = str[0];
                
                // y在词尾的特殊处理
                if (char === 'y') {
                    if (pos === wordLen - 1) {
                        if (pos > 0 && this.isConsonant(word[pos - 1])) {
                            return { type: 'vowel', letters: 'y', sound: 'ī', description: 'y在词尾发 /iː/', length: 1 };
                        } else if (pos > 0 && this.isVowel(word[pos - 1])) {
                            return { type: 'vowel', letters: 'y', sound: 'ē', description: 'y在元音后发 /iː/', length: 1 };
                        }
                    } else if (pos > 0 && this.isConsonant(word[pos - 1])) {
                        return { type: 'vowel', letters: 'y', sound: 'ī', description: 'y在辅音后发 /aɪ/', length: 1 };
                    }
                    return { type: 'consonant', letters: 'y', sound: 'y', description: '辅音 /j/', length: 1 };
                }
                
                // c的软硬音
                if (char === 'c') {
                    if (pos + 1 < wordLen) {
                        const next = word[pos + 1];
                        if ('eiy'.includes(next)) {
                            return { type: 'consonant', letters: 'c', sound: 's', description: 'c在e,i,y前发 /s/', length: 1 };
                        }
                    }
                    return { type: 'consonant', letters: 'c', sound: 'k', description: 'c在a,o,u前发 /k/', length: 1 };
                }
                
                // g的软硬音（带例外）
                if (char === 'g') {
                    if (pos + 1 < wordLen) {
                        const next = word[pos + 1];
                        if ('eiy'.includes(next)) {
                            if (this.rules.gExceptions.includes(word)) {
                                return { type: 'consonant', letters: 'g', sound: 'g', description: 'g发硬音 /ɡ/（例外）', length: 1 };
                            }
                            return { type: 'consonant', letters: 'g', sound: 'j', description: 'g在e,i,y前发 /dʒ/', length: 1 };
                        }
                    }
                    return { type: 'consonant', letters: 'g', sound: 'g', description: 'g在a,o,u前发 /ɡ/', length: 1 };
                }
                
                // 元音
                if (this.isVowel(char)) {
                    const isLastChar = pos === wordLen - 1;
                    const nextIsVowel = pos + 1 < wordLen && this.isVowel(word[pos + 1]);
                    
                    // Magic E检测
                    if (!isLastChar && pos + 2 < wordLen && word[pos + 2] === 'e') {
                        const consonantBetween = word[pos + 1];
                        if (this.isConsonant(consonantBetween)) {
                            let sound, description;
                            switch (char) {
                                case 'a': sound = 'ā'; description = 'Magic E: a发长音 /eɪ/'; break;
                                case 'i': sound = 'ī'; description = 'Magic E: i发长音 /aɪ/'; break;
                                case 'o': sound = 'ō'; description = 'Magic E: o发长音 /əʊ/'; break;
                                case 'u': sound = 'ū'; description = 'Magic E: u发长音 /juː/'; break;
                                default:
                                    sound = this.rules.longVowels[char].sound;
                                    description = this.rules.longVowels[char].description;
                            }
                            return { type: 'magic-e', letters: char, sound: sound, description: description, length: 1 };
                        }
                    }
                    
                    if (isLastChar || nextIsVowel) {
                        const longVowel = this.rules.longVowels[char];
                        return { type: 'vowel', letters: char, sound: longVowel.sound, description: longVowel.description, length: 1 };
                    } else {
                        const shortVowel = this.rules.shortVowels[char];
                        return { type: 'vowel', letters: char, sound: shortVowel.sound, description: shortVowel.description, length: 1 };
                    }
                }
                
                // 辅音
                const consonant = this.rules.consonants[char];
                if (consonant) {
                    return { type: 'consonant', letters: char, sound: consonant.sound, description: consonant.description, length: 1 };
                }
                
                return null;
            }
            
            isVowel(char) {
                return 'aeiou'.includes(char);
            }
            
            isConsonant(char) {
                return /[a-z]/.test(char) && !this.isVowel(char);
            }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            loadWords();
            setupEventListeners();
            setupFreeBlendArea();
        });

        // 创建星空背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 1.5 + 's';
                starsContainer.appendChild(star);
            }
        }

        // 加载单词
        function loadWords() {
            const grid = document.getElementById('wordGrid');
            grid.innerHTML = '';

            let words = [];
            if (currentCategory === 'cvc') {
                words = wordDatabase.cvc[currentVowel] || [];
            } else if (currentCategory === 'consonant') {
                Object.values(wordDatabase.consonant).forEach(categoryWords => {
                    words = words.concat(categoryWords);
                });
            } else if (currentCategory === 'long') {
                Object.values(wordDatabase.long).forEach(categoryWords => {
                    words = words.concat(categoryWords);
                });
            } else if (currentCategory === 'noun') {
                words = wordDatabase.noun;
            } else if (currentCategory === 'verb') {
                words = wordDatabase.verb;
            }

            words.forEach(wordData => {
                const btn = document.createElement('button');
                btn.className = 'word-btn';
                btn.textContent = wordData.word;
                btn.addEventListener('click', () => selectWord(wordData, btn));
                grid.appendChild(btn);
            });

            // 清空积木区
            clearBlocks();
        }

        // 选择单词
        function selectWord(wordData, btn) {
            // 移除其他选中状态
            document.querySelectorAll('.word-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');

            currentWord = wordData;
            updateBlocks(wordData.phonemes);
            showSentences(wordData.sentences);
        }

        // 更新积木
        function updateBlocks(phonemes) {
            const blocks = document.querySelectorAll('.phoneme-block');
            blocks.forEach((block, index) => {
                if (phonemes[index]) {
                    block.textContent = phonemes[index];
                    block.style.opacity = '1';
                } else {
                    block.textContent = '?';
                    block.style.opacity = '0.5';
                }
            });

            document.getElementById('resultWord').textContent = '';
        }

        // 清空积木
        function clearBlocks() {
            const blocks = document.querySelectorAll('.phoneme-block');
            blocks.forEach(block => {
                block.textContent = '?';
                block.style.opacity = '0.5';
            });
            document.getElementById('resultWord').textContent = '';
            document.getElementById('sentences').innerHTML = '';
        }

        // 显示例句
        function showSentences(sentences) {
            const container = document.getElementById('sentences');
            container.innerHTML = '';

            sentences.forEach(sentence => {
                const div = document.createElement('div');
                div.className = 'sentence';
                div.innerHTML = `
                    <div class="en">${sentence}</div>
                    <div class="cn">${sentence}</div>
                `;
                div.addEventListener('click', () => speak(sentence));
                container.appendChild(div);
            });
        }

        // 语音合成
        function speak(text, rate = 1) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.volume = volume;
                utterance.rate = rate;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 逐个发音
        function speakPhonemes(phonemes, index = 0) {
            if (index < phonemes.length) {
                speak(phonemes[index], 0.7);
                setTimeout(() => {
                    speakPhonemes(phonemes, index + 1);
                }, 500);
            }
        }

        // 连起来读
        function blendWord() {
            if (currentWord) {
                speak(currentWord.word);
                document.getElementById('resultWord').textContent = currentWord.word;
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 分类标签
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    loadWords();
                });
            });

            // 积木点击
            document.querySelectorAll('.phoneme-block').forEach(block => {
                block.addEventListener('click', () => {
                    const phoneme = block.textContent;
                    if (phoneme && phoneme !== '?') {
                        speak(phoneme, 0.7);
                    }
                });
            });

            // 连起来读按钮
            document.getElementById('blendBtn').addEventListener('click', blendWord);

            // 单独发音按钮
            document.getElementById('speakBtn').addEventListener('click', () => {
                if (currentWord) {
                    speakPhonemes(currentWord.phonemes);
                }
            });

            // 随机下一个
            document.getElementById('randomBtn').addEventListener('click', () => {
                const buttons = document.querySelectorAll('.word-btn');
                if (buttons.length > 0) {
                    const randomIndex = Math.floor(Math.random() * buttons.length);
                    buttons[randomIndex].click();
                }
            });

            // 慢速播放
            document.getElementById('slowBtn').addEventListener('click', () => {
                if (currentWord) {
                    speak(currentWord.word, 0.5);
                }
            });

            // 音量控制
            document.getElementById('volumeSlider').addEventListener('input', (e) => {
                volume = e.target.value / 100;
            });
        }

        // 设置自由拼读区域
        function setupFreeBlendArea() {
            const wordInput = document.getElementById('wordInput');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const freeBlendBtn = document.getElementById('freeBlendBtn');
            const freeSlowBtn = document.getElementById('freeSlowBtn');
            const freeClearBtn = document.getElementById('freeClearBtn');

            // 分析按钮点击
            analyzeBtn.addEventListener('click', () => {
                const word = wordInput.value.trim();
                if (word) {
                    analyzeFreeWord(word);
                }
            });

            // 输入框回车
            wordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const word = wordInput.value.trim();
                    if (word) {
                        analyzeFreeWord(word);
                    }
                }
            });

            // 连起来读
            freeBlendBtn.addEventListener('click', () => {
                if (currentFreeWord) {
                    speak(currentFreeWord);
                    document.getElementById('freeResultWord').textContent = currentFreeWord;
                }
            });

            // 慢速播放
            freeSlowBtn.addEventListener('click', () => {
                if (currentFreeWord) {
                    speak(currentFreeWord, 0.5);
                }
            });

            // 清除
            freeClearBtn.addEventListener('click', () => {
                wordInput.value = '';
                document.getElementById('freeBlocksContainer').innerHTML = '';
                document.getElementById('freeResultWord').textContent = '';
                document.getElementById('phonemeInfo').style.display = 'none';
                currentFreeWord = null;
            });
        }

        function getExamples(description) {
            if (PHONEME_EXAMPLES[description]) {
                return PHONEME_EXAMPLES[description];
            }
            // 模糊匹配
            for (const [key, examples] of Object.entries(PHONEME_EXAMPLES)) {
                if (description.includes(key) || key.includes(description)) {
                    return examples;
                }
            }
            return null;

        // 分析自由单词
        function analyzeFreeWord(word) {
            currentFreeWord = word;
            
            // 使用分音器分析单词
            const phonemeObjects = segmenter.segment(word);
            const phonemeStrings = phonemeObjects.map(p => p.sound || '?');
            
            // 更新积木显示
            const container = document.getElementById('freeBlocksContainer');
            container.innerHTML = '';
            
            phonemeStrings.forEach((phoneme, index) => {
                if (index > 0) {
                    const plus = document.createElement('span');
                    plus.className = 'free-plus-sign';
                    plus.textContent = '+';
                    container.appendChild(plus);
                }
                
                const block = document.createElement('div');
                block.className = 'free-phoneme-block';
                block.textContent = phoneme;
                block.addEventListener('click', () => {
                    if (phoneme && phoneme !== '?') {
                        speak(phoneme, 0.7);
                    }
                });
                container.appendChild(block);
            });
            
            // 显示发音规则解析
            const infoContainer = document.getElementById('phonemeInfoContent');
            infoContainer.innerHTML = '';
            
            phonemeObjects.forEach((phoneme, index) => {
                const item = document.createElement('div');
                item.className = 'phoneme-info-item';
                const examples = getExamples(phoneme.description);
                const exampleHtml = examples 
                    ? `<div style="margin-top:4px;font-size:0.85em;color:#94a3b8;">例词: ${examples.map(w => `<span style="background:rgba(255,255,255,0.1);padding:1px 6px;border-radius:4px;margin-right:4px;">${w}</span>`).join('')}</div>` 
                    : '';
                item.innerHTML = `
                    <strong>${phoneme.sound || '?'}</strong>: ${phoneme.description}
                    ${exampleHtml}
                `;
                infoContainer.appendChild(item);
            });
            
            document.getElementById('phonemeInfo').style.display = 'block';
            document.getElementById('freeResultWord').textContent = word;
        }
    </script>
</body>
</html>
